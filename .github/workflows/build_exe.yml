name: Build Executables

on:
  workflow_call:
    secrets:
      APPLE_DEV_EMAIL:
      APP_SPEC_PASS:
      DEV_APP_CERT:
      DEV_APP_CERT_PASS:
      APPLE_KEY_PASS:
      APPLE_APP_CERT_ID:
      TEAM_ID:

    inputs:
      is_release:
        default: false
        description: "Is this a release?"
        type: boolean
        required: false

jobs:
  build:
    strategy:
      # Without this a single platform failure cancels the others, so one broken job hides the
      # results for the rest. Each platform's outcome is independent here.
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows
            artifact_name: windows
            os: windows-2022
            version_command: icacls "VERSION" /grant Everyone:F /T /C /Q
          - platform_name: MacOS (x86)
            artifact_name: macos-x86
            os: macos-15-intel
          - platform_name: MacOS (arm64)
            artifact_name: macos-arm64
            os: macos-15

    name: Build ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: "api/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"

      - name: Install Python Dependencies
        run: uv sync --locked --all-extras --dev
        working-directory: api

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.20.x"
          run_install: false

      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: site

      - name: Print version string (for tag)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python -c "with open('VERSION', 'w', encoding='utf-8') as f: f.write('${{ github.ref_name }}')"

      - name: Print version string (for branch)
        if: ${{ github.ref_type != 'tag' }}
        run: |
          python -c "with open('VERSION', 'w', encoding='utf-8') as f: f.write('${{ github.ref_name }}-${{ github.sha }}')"

      - name: Modify version string permission
        if: ${{ matrix.version_command }}
        run: ${{ matrix.version_command }}

      - name: Run Backend Tests
        run: uv run pytest -q
        working-directory: api

      # Must precede the backend build: pyinstaller bundles site/dist into the application.
      - name: Build the Frontend
        run: pnpm build
        working-directory: site

      - name: Create macOS keychain
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_APP_CERTIFICATE: ${{ secrets.DEV_APP_CERT }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.DEV_APP_CERT_PASS }}
          APPLE_KEYCHAIN_PASS: ${{ secrets.APPLE_KEY_PASS }}
        run: |
          echo "$APPLE_APP_CERTIFICATE" | base64 --decode > app_certificate.p12
          security create-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p $APPLE_KEYCHAIN_PASS build.keychain
          security import app_certificate.p12 -k build.keychain -P "$APPLE_APP_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $APPLE_KEYCHAIN_PASS build.keychain
          security find-identity -v -p codesigning

      - name: Build the Application
        env:
          APPLE_APP_CERT_ID: "${{ inputs.is_release && secrets.APPLE_APP_CERT_ID || '' }}"
        run: uv run pyinstaller pyinstaller.spec --noconfirm
        working-directory: api

      # PyInstaller signs the executable it produces, but not every nested dylib and .so. Those
      # must be signed inner-out before the bundle itself, and `codesign --deep` is not a
      # substitute -- Apple explicitly discourages it and notarization rejects the result.
      - name: Sign the macOS app bundle
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_APP_CERT_ID: ${{ secrets.APPLE_APP_CERT_ID }}
          APPLE_KEYCHAIN_PASS: ${{ secrets.APPLE_KEY_PASS }}
        run: |
          set -euo pipefail
          APP="api/dist/CIB Mango Tree API Extractor.app"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASS" build.keychain
          find "$APP" -type f \( -name "*.so" -o -name "*.dylib" \) -print0 |
            xargs -0 -I {} codesign --force --timestamp --options runtime --sign "$APPLE_APP_CERT_ID" {}
          codesign --force --timestamp --options runtime \
            --entitlements ./mango.entitlements --sign "$APPLE_APP_CERT_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create the macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          DMG="api/dist/mango-tree-api-extractor-${{ matrix.artifact_name }}.dmg"
          mkdir -p "$STAGE"
          cp -R "api/dist/CIB Mango Tree API Extractor.app" "$STAGE/"
          # The Applications symlink is what makes the window a drag-to-install target.
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "CIB Mango Tree API Extractor" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"

      - name: Sign, notarize and staple the disk image
        if: runner.os == 'macOS' && inputs.is_release
        env:
          APPLE_APP_CERT_ID: ${{ secrets.APPLE_APP_CERT_ID }}
          APPLE_KEYCHAIN_PASS: ${{ secrets.APPLE_KEY_PASS }}
          APPLE_DEV_EMAIL: ${{ secrets.APPLE_DEV_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPEC_PASS: ${{ secrets.APP_SPEC_PASS }}
        run: |
          set -euo pipefail
          DMG="api/dist/mango-tree-api-extractor-${{ matrix.artifact_name }}.dmg"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASS" build.keychain
          # Signed with the Application identity, not the Installer one: that is for .pkg files.
          codesign --force --timestamp --sign "$APPLE_APP_CERT_ID" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_DEV_EMAIL" \
            --team-id "$APPLE_TEAM_ID" --password "$APP_SPEC_PASS" --wait
          # Stapling is what lets Gatekeeper approve the app offline on first launch.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Absolute paths: NSIS resolves relative ones against the .nsi's own directory.
          makensis \
            //DINPUT_DIR="$(cygpath -w "$GITHUB_WORKSPACE/api/dist/mango-tree-api-extractor")" \
            //DOUTPUT_FILE="$(cygpath -w "$GITHUB_WORKSPACE/api/dist/mango-tree-api-extractor-windows-installer.exe")" \
            //DAPP_VERSION="$(cat VERSION)" \
            installer.nsi

      - name: Remove the unpacked build directory
        shell: bash
        run: rm -rf "api/dist/mango-tree-api-extractor" "api/dist/CIB Mango Tree API Extractor.app"

      - name: Inspect artifacts before uploading
        shell: bash
        run: ls -l api/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: api/dist/*
