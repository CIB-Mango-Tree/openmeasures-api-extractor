[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "anyio==4.10.0",
    "click==8.2.1",
    "h11==0.16.0",
    "idna==3.15",
    "platformdirs>=4.5.0",
    "polars>=1.43.2",
    "pydantic>=2.11.7",
    "pyinstaller>=6.16.0",
    "python-dateutil>=2.9.0.post0",
    "pyventus>=0.7.1",
    "requests>=2.32.5",
    "sniffio==1.3.1",
    "sqlalchemy>=2.0.43",
    "starlette==1.3.1",
    "typing-extensions>=4.15.0",
    "tzlocal>=5.3.1",
    "uvicorn==0.35.0",
    "websockets>=15.0.1",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# api/ itself must be importable so tests can `from src...` the same way main.py does.
pythonpath = ["."]
testpaths = ["tests"]
