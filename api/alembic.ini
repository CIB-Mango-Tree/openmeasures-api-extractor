# Development-time configuration only, for `alembic revision --autogenerate` and `alembic check`.
# The application never reads this file: src/db/migrate.py builds a Config in code so that
# script_location can be resolved under sys._MEIPASS in the frozen binary.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Only used by the CLI. At runtime the app passes its own connection via config.attributes.
sqlalchemy.url = sqlite:///app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
